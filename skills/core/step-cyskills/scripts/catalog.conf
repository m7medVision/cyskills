pwn-chain|An end-to-end engineering methodology from reverse engineering to a working exploit. Use cases: you have a binary + a vulnerability point + the target environment and need to write an exploit that reliably lands (not a script that only reproduces locally but crashes the moment it hits a remote). Covers three major tracks: stack overflow / heap exploitation / kernel pwn. Emphasizes the engineering gap between \"works locally in CTF → reliably lands against a real remote\": libc version mismatch, heap spray timing, SMEP/SMAP/KASLR, stack alignment, remote buffering. Core toolchain: pwntools + GEF/pwndbg + ROPgadget/Ropper + one_gadget + libc-database + qemu-system kernel debugging. Trigger keywords: pwn, stack overflow, heap overflow, ROP, ret2libc, ret2csu, one_gadget, libc-database, heap exploitation, tcache, fastbin, unsorted bin, kernel pwn, kROP, SMEP, SMAP, KASLR, modprobe_path, pwntools, GEF, pwndbg.|binary-re
